name: CI

on:
  push:
    branches-ignore: [archive-snapshot]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global typescript@5.9.2
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
