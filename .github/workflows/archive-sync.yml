name: Archive Sync

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optional single SCP Wiki slug, e.g. scp-049. Leave blank for seed manifest.'
        required: false
        type: string
  schedule:
    - cron: '17 3 * * 2,5'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synchronize SCP Wiki records
        shell: bash
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            node tools/archive-sync/cli.mjs --slug "${{ inputs.slug }}"
          else
            node tools/archive-sync/cli.mjs --seeds content/archive-seeds.json
          fi
      - name: Publish archive snapshot
        shell: bash
        run: bash tools/archive-sync/publish-snapshot.sh
